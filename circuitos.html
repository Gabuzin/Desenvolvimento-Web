<!DOCTYPE html>
<html lang='en'>

<head>
    <meta charset='utf-8'>
    <meta name='viewport' content='width=device-width, initial-scale=1'>
    <title>LapTimer - RaceMetrics</title>
    <link rel='stylesheet' href='style.css'>
    <script src='script.js'></script>
</head>

<body>
    <header class='header'>
        <img src="logo.png" , width="400">
        <nav class="navbar">
            <a href="index.html">Início</a>
            <a href="telemetria.html">Telemetria</a>
            <a href="circuitos.html">Circuitos</a>
            <a href="contato.html">Contato</a>
        </nav>
    </header>
    <main class="container">
        <section class="card">

            <div align="center">
                <h3>Selecione a sua pista de corrida</h3>
                <div id="selecaoPista">
                    <select name="pista" id="pista" onchange="mostrarPista()">
                        <option value="interrogacao">Selecione uma pista</option>
                        <option value="Interlagos">Autodromo de Interlagos (São Paulo - SP)</option>
                        <option value="Goiania">Autodromo Internacional de Goiânia (Goiânia - GO)</option>
                        <option value="Taruma">Autodromo Internacional de Tarumã (Viamão - RS)</option>
                        <option value="Mogi-Guaçu">Autodromo Velocitta (Mogi Guaçu - SP)</option>
                    </select>
                    <button type="button" onclick="mostrarCadastro()">
                        Adicionar pista
                    </button>
                </div>

                <div id="formularioPista" style="display: none;" align="center">
                    <h3>Cadastro de pista</h3>

                    <form>
                        <label for="nome">Nome da pista:</label>
                        <input type="text" id="nome" name="nome" required>

                        <br><br>

                        <label for="cidade">Cidade:</label>
                        <input type="text" id="cidade" name="cidade" required>

                        <br><br>

                        <label for="comprimento">latitude</label>
                        <input type="number" id="comprimento" name="comprimento" required>

                        <br><br>

                        <button type="submit">Salvar</button>
                    </form>
                </div>

                <div id="imagemPista"></div>
            </div>


        </section>


    </main>

</body>

</html>
